- id: cyber
  name: Cyberpunk
  description: Погрузитесь в атмосферу киберпанка и неонового нуара.
  text: |
    <h2>Пролог</h2>
    <p>Мегаполис Нью-Каскадия, 2099 год. Дождь заливает панорамное окно, в котором отражаются голограммы корпораций. 
    Вы - частный детектив, у которого карманы пусты так же, как и его банковский чип. Вам подкинули простую, на первый 
    взгляд, работу: забрать зашифрованный дата-пад из квартиры пропавшего нетраннера (хакера).</p>
    <h3>Цифровой след в неоне</h3>
    <p>Трущобы «Нижнего яруса». Узкий технический коридор жилого блока, пахнущий дешевой лапшой быстрого приготовления 
    и перегретым пластиком. Вы стоите перед дверью квартиры №404.</p>
  startSceneId: cyber-0
  scenes:
    # Act 1
    - id: cyber-0
      questId: cyber
      text: |
        <h2>Умный дом с характером</h2>
        <p>Дверь квартиры заблокирована. На месте обычного замка установлен биометрический терминал с мерцающим неоновым 
        экраном. Из динамика раздается искусственный, вызывающе вежливый голос ИИ-консьержа: <i>«Приветствую. Квартира 
        гражданина Ли находится в режиме карантина. Для получения доступа, пожалуйста, приложите ладонь или введите 
        персональный ключ сотрудника "Синтез-Корп"».</i></p>
        <p>У вас, естественно, нет ни ключа, ни допуска. Но зайти внутрь нужно. Справа от двери вы замечаете приоткрытый 
        щиток распределителя систем вентиляции, а на полу валяется пустая банка из-под энергетика.</p>
        <p>Ваши действия:</p>
      options:
        - id: cyber-0-0
          text: |
            Изучить вентиляционный щиток: попробовать перегрузить систему охлаждения, чтобы заставить ИИ открыть двери 
            для «проветривания».
          nextSceneId: cyber-1
        - id: cyber-0-1
          text: |
            Попробовать взломать терминал напрямую: использовать свой старый кибердевайс, чтобы запустить простую 
            вирусную утилиту.
          nextSceneId: cyber-2
        - id: cyber-0-2
          text: "Обыскать коридор: поискать вокруг зацепки или вещи, которые мог оставить хозяин перед исчезновением."
          nextSceneId: cyber-3
        - id: cyber-0-3
          text: "Попытаться обмануть ИИ: сказать, что вы - служба доставки еды «Дракон-Экспресс» и принесли заказ."
          nextSceneId: cyber-4
    - id: cyber-1
      questId: cyber
      text: |
        <p>Заглянув внутрь, вы видите хитросплетение трубок. Система ИИ замечает ваше вмешательство и предупреждает:
        <i>«Внимание: несанкционированный доступ к климат-контролю. Система заблокирована во избежание саботажа».</i></p>
        <p>Этот путь отрезан, но вы замечаете, что от щитка идет резервный кабель питания к терминалу двери.</p>
      options:
        - id: cyber-1-0
          text: Осмотреть резервный кабель.
          nextSceneId: cyber-10
    - id: cyber-2
      questId: cyber
      text: |
        Вы подключаете провод к разъему за ухом и запускаете хакерский софт. Экран терминала на секунду заплывает артефактами, 
        но защита корпорации оказывается сильнее. Ваш девайс сгорает, пустив тонкую струйку дыма, а вы получаете болезненный 
        разряд статического электричества прямо в нейросеть. Вариант со взломом больше недоступен, а от головной боли перед 
        глазами теперь плывут цифровые мушки.
      options:
        - id: cyber-2-0
          text: |
            Изучить вентиляционный щиток: попробовать перегрузить систему охлаждения, чтобы заставить ИИ открыть двери 
            для «проветривания».
          nextSceneId: cyber-1
        - id: cyber-2-1
          text: "Обыскать коридор: поискать вокруг зацепки или вещи, которые мог оставить хозяин перед исчезновением."
          nextSceneId: cyber-3
        - id: cyber-2-2
          text: "Попытаться обмануть ИИ: сказать, что вы - служба доставки еды «Дракон-Экспресс» и принесли заказ."
          nextSceneId: cyber-4
    - id: cyber-3
      questId: cyber
      text: |
        <p>Вы пинаете банку из-под энергетика и замечаете под ней выброшенный чек из круглосуточного лапшичного бара 
        «У Сана» на первом ярусе. На обратной стороне чека корявым почерком мистера Ли написано: <i>«Пароль от терминала 
        - дата основания Синтез-Корп. Запомни, идиот!».</i></p>
      options:
        - id: cyber-3-0
          text: Осмотреть терминал.
          nextSceneId: cyber-20
    - id: cyber-4
      questId: cyber
      text: |
        ИИ сканирует ваше лицо: <i>«Анализ униформы... Отсутствует. Проверка текущих заказов для квартиры 404... Заказов нет. 
        Попытка обмана зафиксирована. Вызываю муниципальную службу дронов-коллекторов».</i> Из конца коридора доносится 
        нарастающее гудение пропеллеров. Вам приходится прыгать в мусоропровод, чтобы спастись. <b>Поражение.</b>
      gameState: LOST
    # Act 2-A
    - id: cyber-10
      questId: cyber
      text: |
        <p>Вы стоите у открытого щитка. Резервный кабель идет в обход сгоревшей основной защиты, но он находится под напряжением. 
        ИИ-консьерж молчит, но датчики терминала на двери всё ещё активны. У вас в кармане есть металлическая заколка.</p>
        <p>Ваши действия:</p>
      options:
        - id: cyber-10-0
          text: Аккуратно замкнуть заколкой контакты реле заземления, чтобы обесточить только магнитный замок двери.
          nextSceneId: cyber-11
        - id: cyber-10-1
          text: |
            Со всей силы воткнуть заколку в главный распределитель тока, вызвав мощный импульс напряжения по всей 
            электросети квартиры.
          nextSceneId: cyber-12
        - id: cyber-10-2
          text: |
            Вылить остатки газировки из лежащей на полу банки на оголенные провода щитка, чтобы спровоцировать «естественное» 
            замыкание от влаги.
          nextSceneId: cyber-13
    - id: cyber-11
      questId: cyber
      text: |
        Ваши пальцы не дрогнули. Раздается негромкий щелчок, замок двери обесточивается, и она с шипением отходит в сторону. 
        Вся остальная техника внутри квартиры осталась целой.
      options:
        - id: cyber-11-0
          text: Зайти в квартиру.
          nextSceneId: cyber-30
    - id: cyber-12
      questId: cyber
      text: |
        Происходит яркая вспышка! Замок на двери открывается, но мощный импульс тока уходит внутрь квартиры. Когда вы 
        заходите, то понимаете, что сожгли не только замок, но и всю электронику внутри, включая терминал управления 
        умным домом и сам дата-пад. Цель миссии уничтожена. <b>Поражение.</b>
      gameState: LOST
    - id: cyber-13
      questId: cyber
      text: |
        Жидкость мгновенно коротит контакты. Но вместо того чтобы открыть дверь, система безопасности ИИ расценивает это 
        как «аварию и затопление». Дверь не просто блокируется, а намертво запечатывается аварийными металлическими шторками. 
        Открыть их без плазменного резака невозможно. Вам приходится уйти ни с чем. <b>Поражение.</b>
      gameState: LOST
    # Act 2-B
    - id: cyber-20
      questId: cyber
      text: |
        <p>Вы стоите перед неоновым терминалом. В подсказке сказано: <i>«Пароль - дата основания Синтез-Корп. За 24 года до 
        Великого Блэкаута 2099 года».</i> Вы провели расчеты в инфо-планшете, и у вас есть несколько вариантов трактовки этой 
        исторической даты.</p>
        <p>Ваши действия:</p>
      options:
        - id: cyber-20-0
          text: Ввести на терминале код «2123».
          nextSceneId: cyber-21
        - id: cyber-20-1
          text: Ввести на терминале код «2075».
          nextSceneId: cyber-22
        - id: cyber-20-2
          text: Попробовать ввести «0000» (сброс к заводским настройкам).
          nextSceneId: cyber-23
    - id: cyber-21
      questId: cyber
      text: |
        Неверный код. Экран вспыхивает красным: <i>«Попытка подбора пароля. Доступ заблокирован на 2 часа. Отправлен 
        сигнал в охранную службу».</i> Ждать два часа у вас времени нет, миссия провалена. <b>Поражение.</b>
      gameState: LOST
    - id: cyber-22
      questId: cyber
      text: |
        Терминал загорается мягким зеленым светом: <i>«Добро пожаловать, сотрудник Синтез-Корп. Карантин снят».</i> 
        Дверь плавно открывается. Вы получаете полный административный доступ к квартире.
      options:
        - id: cyber-22-0
          text: Зайти в квартиру.
          nextSceneId: cyber-40
    - id: cyber-23
      questId: cyber
      text: |
        Терминал издает протяжный писк. Заводской сброс активирует протокол уничтожения данных пользователя при краже. 
        Изнутри квартиры доносится тихий хлопок - термический заряд выжег жесткие диски. Дверь открывается, но нужный 
        вам дата-пад превратился в кусок оплавленной пластмассы. <b>Поражение.</b>
      gameState: LOST
    # Act 3-A
    - id: cyber-30
      questId: cyber
      text: |
        <h2>Квартира нетраннера</h2>
        <p>Комната погружена во мрак, свет идет только от разбитых мониторов. Осмотревшись, вы решили подойти к столу,
        стоящему в углу. На столе мерцает цель вашего визита - <b>зашифрованный дата-пад.</b></p>
        <p>Вдруг экран одного из мониторов загорается, и на нем появляется лицо человека в маске. Это наниматель, который 
        дал вам этот заказ через шифрованный канал.</p>
        <p>- «Вижу, ты внутри, детектив, - раздается измененный голос. - Забирай дата-пад. Но учти: корпорация "Синтез" 
        уже выслала за ним штурмовой отряд. Они будут на твоем ярусе через 2 минуты. Скинь мне данные прямо сейчас через 
        порт на столе, и я переведу тебе тройную оплату. Но если ты оставишь дата-пад себе и попытаешься вынести его - 
        я сотру твою личность из базы данных граждан».</p>
        <p>Ваши действия:</p>
      options:
        - id: cyber-30-0
          text: Подключить дата-пад к порту на столе и загрузить данные нанимателю.
          nextSceneId: cyber-31
        - id: cyber-30-1
          text: Спрятать дата-пад в плащ, проигнорировать угрозы и побежать к пожарной лестнице.
          nextSceneId: cyber-32
    - id: cyber-31
      questId: cyber
      text: |
        Шкала загрузки доходит до 100%. На ваш счет падает круглая сумма. Наниматель отключается со словами: 
        «Приятно иметь дело с профессионалом». Вы выходите через окно на пожарную лестницу как раз в тот момент, 
        когда штурмовики выбивают дверь. Вы богаты, но дата-пад остался у загадочного человека, который теперь может 
        шантажировать половину города. <b>Победа?</b>
      gameState: WON
    - id: cyber-32
      questId: cyber
      text: |
        Вы хватаете прибор и бежите. На пожарной лестнице вас зажимают штурмовики. Вас ждет долгий допрос в подвалах 
        корпорации. <b>Поражение.</b>
      gameState: LOST
    # Act 3-B
    - id: cyber-40
      questId: cyber
      text: |
        <h2>Квартира нетраннера</h2>
        <p>Комната погружена во мрак, свет идет только от разбитых мониторов. Осмотревшись, вы решили подойти к столу,
        стоящему в углу. На столе мерцает цель вашего визита - <b>зашифрованный дата-пад.</b></p>
        <p>Вдруг экран одного из мониторов загорается, и на нем появляется лицо человека в маске. Это наниматель, который 
        дал вам этот заказ через шифрованный канал.</p>
        <p>- «Вижу, ты внутри, детектив, - раздается измененный голос. - Забирай дата-пад. Но учти: корпорация "Синтез" 
        уже выслала за ним штурмовой отряд. Они будут на твоем ярусе через 2 минуты. Скинь мне данные прямо сейчас через 
        порт на столе, и я переведу тебе тройную оплату. Но если ты оставишь дата-пад себе и попытаешься вынести его - 
        я сотру твою личность из базы данных граждан».</p>
        <p>Ваши действия:</p>
      options:
        - id: cyber-40-0
          text: Подключить дата-пад к порту на столе и загрузить данные нанимателю.
          nextSceneId: cyber-31
        - id: cyber-40-1
          text: Спрятать дата-пад в плащ, проигнорировать угрозы и побежать к пожарной лестнице.
          nextSceneId: cyber-32
        - id: cyber-40-2
          text: |
            Используя чистый доступ к терминалу, перенаправить штурмовой отряд корпорации на другой этаж, выиграв время 
            для побега с дата-падом.
          nextSceneId: cyber-41
    - id: cyber-41
      questId: cyber
      text: |
        Вы быстро меняете в системе умного дома номер вашей квартиры с 404 на 504. Штурмовики с грохотом врываются к 
        испуганному соседу этажом выше. Вы спокойно спускаетесь по лифту, держа в кармане ценнейшие секреты корпорации, 
        которые теперь можно продать на черном рынке за любые деньги. <b>Победа!</b>
      gameState: WON
- id: fallout
  name: Fallout
  description: Приключение в постапокалиптическом будущем.
  text: |
    <h2>Ошибка распределения напряжения</h2>
    <p>Вы находитесь на развалинах довоенного исследовательского центра «Гелиос-Оптик». Сухая пустыня, под ногами 
    хрустит радиоактивный песок. Вы ищете ценный хлам на продажу и натыкаетесь на запертый бункер...</p>
  startSceneId: fallout-0
  scenes:
    # Act 1
    - id: fallout-0
      questId: fallout
      text: |
        <h2>Гермозатвор</h2>
        <p>Перед вами тяжелая стальная дверь с эмблемой Vault-Tec, покрытая ржавчиной и копотью. Панель управления рядом 
        с ней мигает тусклым оранжевым светом. Из динамика доносится скрежет, переходящий в монотонный механический голос:
        <i>«Внимание. Зафиксирована утечка охлаждающей жидкости в секторе Б. Доступ заблокирован до прибытия ремонтной бригады. 
        Расчетное время ожидания: 174 года... 3 месяца...»</i></p>
        <p>Прямо перед дверью сидит потрепанный гуль в грязном лабораторном халате и пытается ковырять панель ржавой отверткой. 
        Заметив вас, он хрипит:</p>
        <p>- О, еще один стервятник. Даже не пытайся, парень. Эта консервная банка заклинила намертво. 
        А внутри - работающий очиститель воздуха и склад медикаментов. Поделим тридцать на семьдесят, если поможешь открыть. 
        Семьдесят мне, разумеется. За экспертную оценку.</p>
        <p>Ваши действия:</p>
      options:
        - id: fallout-0-0
          text: Осмотреть панель управления и провода.
          nextSceneId: fallout-1
        - id: fallout-0-1
          text: Попробовать применить грубую силу и рвануть дверь руками.
          nextSceneId: fallout-2
        - id: fallout-0-2
          text: "Предложить гулю сделку: «Пятьдесят на пятьдесят, или я открываю её сам, а ты уходишь ни с чем»."
          nextSceneId: fallout-3
        - id: fallout-0-3
          text: Ударить по панели ботинком в надежде, что электроника закоротит.
          nextSceneId: fallout-4
    - id: fallout-1
      questId: fallout
      text: |
        Вы замечаете, что кабели питания идут не изнутри, а напрямую от распределительного щитка под ногами гуля. 
        Более того, Уолтер (так зовут гуля) сидит прямо на оголенном толстом проводе.
      options:
        - id: fallout-1-0
          text: Попробовать разобраться с проводкой.
          nextSceneId: fallout-10
    - id: fallout-2
      questId: fallout
      text: |
        Вы с хрустом вонзаете пальцы в щель гермозатвора и тянете изо всех сил. Металл даже не шевелится, зато 
        вы сильно растягиваете запястье. Вы теряете пару очков здоровья, а гуль ехидно хихикает: «Физический труд 
        облагораживает, ага. Ладно, давай думать головой».
      options:
        - id: fallout-2-0
          text: Осмотреть панель управления и провода.
          nextSceneId: fallout-1
        - id: fallout-2-1
          text: "Предложить гулю сделку: «Пятьдесят на пятьдесят, или я открываю её сам, а ты уходишь ни с чем»."
          nextSceneId: fallout-3
        - id: fallout-2-2
          text: Ударить по панели ботинком в надежде, что электроника закоротит.
          nextSceneId: fallout-4
    - id: fallout-3
      questId: fallout
      text: |
        Гуль хмурится, вздыхает, прячет отвертку и соглашается: «Ладно, ладно, по рукам! Меня зовут Уолтер. 
        Смотри, у меня есть код от первой цепи питания, но замкнуло вторую, которая идет от распределительного щитка. 
        Надо пустить ток в обход».
      options:
        - id: fallout-3-0
          text: Попробовать разобраться с проводкой.
          nextSceneId: fallout-10
    - id: fallout-4
      questId: fallout
      text: |
        Раздается громкий треск. Из панели сыплются искры, одна из которых попадает прямо в открытую канистру с бензином, 
        которую Уолтер держал неподалеку для своей горелки. Происходит небольшой взрыв! Вы отлетаете к стене, получая ожоги. 
        Когда дым рассеивается, вы видите, что панель полностью сгорела, а Уолтер в ярости выхватывает револьвер. 
        Вам приходится бежать обратно в пустошь ни с чем. <b>Поражение.</b>
      gameState: LOST
    # Act 2
    - id: fallout-10
      questId: fallout
      text: |
        <h2>Манипуляции с током</h2>
        <p>Вы разбираетесь с проводкой у распределительного щитка. Чтобы подать напряжение на замок двери, нужно 
        перенаправить энергию из соседней подстанции. Однако эта линия сейчас питает старую защитную турель, которая 
        висит под потолком и находится в режиме сна.</p>
        <p>Ваши действия:</p>
      options:
        - id: fallout-10-0
          text: "Перерезать синий провод: попытаться полностью обесточить турель перед перенаправлением питания."
          nextSceneId: fallout-11
        - id: fallout-10-1
          text: "Перерезать красный провод: напрямую замкнуть линию на гермозатвор, оставив турель под напряжением."
          nextSceneId: fallout-12
        - id: fallout-10-2
          text: Сначала расстрелять турель из пистолета, а уже потом спокойно копаться в проводах щитка.
          nextSceneId: fallout-13
    - id: fallout-11
      questId: fallout
      text: |
        Вы угадали с фазой. Питание турели отключается, ее датчики гаснут. 
        Энергия перенаправляется на дверь, и тяжелый гермозатвор со скрежетом отъезжает в стену.
      options:
        - id: fallout-11-0
          text: Зайти в бункер.
          nextSceneId: fallout-20
    - id: fallout-12
      questId: fallout
      text: |
        Происходит скачок напряжения. Дверь открывается, но резкое изменение тока мгновенно активирует турель! 
        Она успевает сделать короткую очередь по комнате, прежде чем перегрузиться. Вы получаете ранение, но путь внутрь открыт.
      options:
        - id: fallout-12-0
          text: Зайти в бункер.
          nextSceneId: fallout-20
    - id: fallout-13
      questId: fallout
      text: |
        Грохот выстрелов разносится по коридорам. Турель разлетается на куски, но осколки повреждают распределительный щиток. 
        Ток окончательно пропадает, замок намертво блокируется. Уолтер смотрит на вас как на сумасшедшего: «Отличная стрельба, 
        ковбой. Теперь мы точно туда не попадем». Вам приходится уйти. <b>Поражение.</b>
      gameState: LOST
    # Act 3
    - id: fallout-20
      questId: fallout
      text: |
        <h2>Внутри бункера</h2>
        <p>Внутри пахнет озоном и столетней пылью. В центре комнаты стоит медицинская капсула, в которой лежит скелет 
        в форме довоенного офицера Анклава. На его руке поблескивает то, ради чего вы пришли - <b>армейский супер-стимпак 
        и электронный чип доступа.</b></p>
        <p>Но путь к капсуле преграждает старый робот-часовой «Мистер Помощник». Его три глаза-камеры фокусируются на вас. 
        Из огнемета на одной из манипуляторов капает горючая смесь.</p>
        <p>- «Приветствую, сержант! - скрипит робот, обращаясь к скелету. Затем поворачивается к вам: - Обнаружены гражданские 
        лица без допуска. Пожалуйста, предъявите пропуск-жетон в течение 10 секунд, иначе будет применен протокол дезинфекции. 
        Девять... восемь...»</p>
        <p>Уолтер прячется за вашей спиной: «Так, гений, твой ход. С роботами я не воюю».</p>
        <p>Ваши действия:</p>
      options:
        - id: fallout-20-0
          text: |
            Попытаться обмануть робота: «Сержант мертв. Я его законный преемник, лейтенант Максимус. 
            База атакована, отставить протокол дезинфекции!»
          nextSceneId: fallout-21
        - id: fallout-20-1
          text: |
            Обыскать скелет: быстро подбежать к капсуле и попытаться найти жетон в карманах формы, пока робот считает секунды.
          nextSceneId: fallout-22
        - id: fallout-20-2
          text: |
            Использовать окружение: заметить на стене позади робота красный рычаг аварийной системы пожаротушения и выстрелить в него.
          nextSceneId: fallout-23
    - id: fallout-21
      questId: fallout
      text: |
        Робот застывает на секунду, обрабатывая информацию: «Идентификация по голосу... Отказано. Лейтенант Максимус 
        числится дезертиром с 2077 года. Применяю протокол ликвидации». Огнемет вспыхивает, вы едва успеваете выскочить 
        наружу, получая сильные ожоги и оставаясь без добычи. <b>Поражение.</b>
      gameState: LOST
    - id: fallout-22
      questId: fallout
      text: |
        Пока робот монотонно считает «...три... два...», вы ныряете к капсуле и судорожно шарите по карманам скелета. 
        Ваши пальцы натыкаются на металлический жетон. Вы выставляете его перед камерами робота на счете «один». 
        Робот замирает: «Жетон принят. Приятного дня, сэр», после чего отъезжает в угол и переходит в режим ожидания. 
        Вы забираете супер-стимпак и чип. <b>Победа!</b>
      gameState: WON
    - id: fallout-23
      questId: fallout
      text: |
        Точный выстрел разбивает рычаг. Из потолочных форсунок под огромным давлением вырывается струя специальной пены 
        для тушения электроники. «Мистера Помощника» начинает коротить, его системы замыкает, и он с глухим стуком отключается. 
        Путь свободен, вы забираете добычу. <b>Победа!</b>
      gameState: WON
- id: ship
  name: Spaceship
  description: Отправьтесь в приключение на космическом корабле.
  text: |
    <h2>Пролог</h2>
    <p>Ты стоишь в космическом порту и готов подняться на борт своего корабля. Разве ты не об этом мечтал? Стать капитаном 
    галактического судна с экипажем, который будет совершать подвиги под твоим командованием. Так что вперед!</p>
    <h3>Знакомство с экипажем</h3>
    <p>Когда ты поднялся на борт корабля, тебя поприветствовала девушка с черной палкой в руках:</p>
    <p>- Здравствуйте, командир! Я Зинаида - ваша помощница. Видите? Там в углу пьет кофе наш штурман - сержант Перегарный 
    Шлейф, под штурвалом спит наш бортмеханик - Черный Богдан, а фотографирует его Сергей Стальная Пятка - наш навигатор.
    А как обращаться к вам?</p>
  startSceneId: ship-0
  scenes:
    - id: ship-0
      questId: ship
      text: Ты потерял память. Принять вызов НЛО?
      options:
        - id: ship-0-0
          text: Принять вызов.
          nextSceneId: ship-1
        - id: ship-0-1
          text: Отклонить вызов.
          nextSceneId: ship-4
    - id: ship-1
      questId: ship
      text: Ты принял вызов. Поднимешься на мостик к капитану?
      options:
        - id: ship-1-0
          text: Подняться на мостик.
          nextSceneId: ship-2
        - id: ship-1-1
          text: Отказаться подниматься на мостик.
          nextSceneId: ship-5
    - id: ship-2
      questId: ship
      text: Ты поднялся на мостик. Кто ты?
      options:
        - id: ship-2-0
          text: Рассказать правду о себе.
          nextSceneId: ship-3
        - id: ship-2-1
          text: Солгать о себе.
          nextSceneId: ship-6
    - id: ship-3
      questId: ship
      text: Тебя вернули домой. <b>Победа!</b>
      gameState: WON
    - id: ship-4
      questId: ship
      text: Ты отклонил вызов. <b>Поражение.</b>
      gameState: LOST
    - id: ship-5
      questId: ship
      text: Ты не пошел на переговоры. <b>Поражение.</b>
      gameState: LOST
    - id: ship-6
      questId: ship
      text: Твою ложь разоблачили. <b>Поражение.</b>
      gameState: LOST
